<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistant Acme</title>
  <style>
    :root {
      --bg: #111111;
      --panel: #1c1c1c;
      --ink: #f4f4f4;
      --muted: #9a9a9a;
      --accent: #ffcc33;
      --line: #2a2a2a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.45 "Helvetica Neue", Helvetica, Arial, sans-serif; }
    body { display: grid; grid-template-rows: auto 1fr auto; max-width: 860px; margin: 0 auto; }
    header { padding: 1.25rem 1.5rem 0.5rem; }
    header p { margin: 0.25rem 0 0; color: var(--muted); font-size: 0.9rem; }
    h1 { margin: 0; font-size: 1.35rem; letter-spacing: 0.04em; text-transform: uppercase; }
    h1 span { color: var(--accent); }
    #log { overflow-y: auto; padding: 1rem 1.5rem; display: flex; flex-direction: column; gap: 0.75rem; }
    .msg { max-width: 85%; padding: 0.8rem 1rem; border-radius: 14px; white-space: pre-wrap; }
    .user { align-self: flex-end; background: var(--accent); color: #111; }
    .bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
    .meta { font-size: 0.72rem; color: var(--muted); margin-bottom: 0.35rem; letter-spacing: 0.06em; text-transform: uppercase; }
    form { display: flex; gap: 0.5rem; padding: 1rem 1.5rem 1.5rem; border-top: 1px solid var(--line); background: var(--bg); }
    input { flex: 1; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 0.85rem 1.1rem; font: inherit; }
    button { background: var(--accent); color: #111; border: 0; border-radius: 999px; padding: 0.85rem 1.2rem; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <header>
    <h1>Assistant <span>Acme</span></h1>
    <p>Gamme, technique électrique, après-vente — orchestration Flash / Pro + RAG</p>
  </header>
  <div id="log"></div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="Ex. autonomie de la Mégane E-Tech ?">
    <button type="submit">Envoyer</button>
  </form>
  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const conversationId = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now());

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      append("user", message);
      input.value = "";
      const bot = append("bot", "");
      form.querySelector("button").disabled = true;
      try {
        const response = await fetch("/api/v1/conversations/" + conversationId + "/messages", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "text/event-stream" },
          body: JSON.stringify({ message })
        });
        if (!response.ok) {
          bot.querySelector(".body").textContent = "Erreur " + response.status;
          return;
        }
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split("\n\n");
          buffer = parts.pop();
          for (const part of parts) {
            const dataLine = part.split("\n").find(line => line.startsWith("data:"));
            if (!dataLine) continue;
            const payload = JSON.parse(dataLine.slice(5).trim());
            if (payload.type === "meta") {
              bot.querySelector(".meta").textContent = payload.intent + " · " + payload.model;
            } else if (payload.type === "token") {
              bot.querySelector(".body").textContent += payload.text || "";
            } else if (payload.type === "error") {
              bot.querySelector(".body").textContent = payload.text;
            }
          }
        }
      } finally {
        form.querySelector("button").disabled = false;
        log.scrollTop = log.scrollHeight;
      }
    });

    function append(role, text) {
      const wrap = document.createElement("div");
      wrap.className = "msg " + role;
      if (role === "bot") {
        wrap.innerHTML = '<div class="meta">…</div><div class="body"></div>';
        wrap.querySelector(".body").textContent = text;
      } else {
        wrap.textContent = text;
      }
      log.appendChild(wrap);
      log.scrollTop = log.scrollHeight;
      return wrap;
    }
  </script>
</body>
</html>
